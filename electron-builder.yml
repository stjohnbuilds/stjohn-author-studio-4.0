appId: com.stjohnbuilds.authorstudio
productName: StJohn Author Studio
copyright: Copyright © 2026 StJohn Builds

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - build/icon.ico
  - main.js
  - preload.js
  - packages/audio-engine/whisper-json.cjs
  - node_modules/**/*
  - package.json

extraResources:
  - from: bin/
    to: bin/
    filter:
      - "ggml-base.en.bin"
      - "whisper-cli-*"
      - "*.dll"
      - "!ggml-large-v3-turbo.bin"
  - from: build/icon.ico
    to: build/icon.ico

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch: [arm64]
    - target: zip
      arch: [arm64]

win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Hyphens, not spaces. GitHub silently rewrites filenames with spaces
  # to use dots when you upload via gh CLI ("a b c.exe" -> "a.b.c.exe"),
  # but electron-builder writes the URL into latest.yml using hyphens
  # ("a-b-c.exe"). That mismatch makes electron-updater 404 on the
  # download. Naming the artifact with hyphens from the start keeps
  # GitHub from renaming it.
  artifactName: StJohn-Author-Studio-Setup.exe
  oneClick: false
  perMachine: false
  # Force per-user-only install. With allowElevation:false the installer
  # can never ask for admin rights and the per-user/per-machine choice
  # page is suppressed — the install always lands in
  # %LOCALAPPDATA%\Programs\StJohn Author Studio. That's the folder the
  # auto-updater can overwrite without UAC, so future releases install
  # themselves silently. Trade-off: install is one-user-at-a-time; on a
  # shared PC each Windows account installs its own copy. Acceptable for
  # Marie's "give it to friends on their own laptops" use case.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico

# Auto-update via GitHub Releases. electron-updater inside the running
# app reads `latest.yml` (Windows) / `latest-mac.yml` (Mac) attached to
# the latest non-draft release at this repo to decide whether a newer
# version exists. When `electron-builder` runs locally it generates
# those metadata files alongside the artifacts; the release-publish
# step uploads them all together.
publish:
  provider: github
  owner: stjohnbuilds
  repo: stjohn-author-studio-4.0
