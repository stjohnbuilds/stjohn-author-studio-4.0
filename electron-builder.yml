appId: com.stjohnbuilds.authorstudio
productName: StJohn Author Studio
copyright: Copyright © 2026 StJohn Builds

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - build/icon.ico
  - main.js
  - preload.js
  - packages/audio-engine/whisper-json.cjs
  - node_modules/**/*
  - package.json

extraResources:
  - from: bin/
    to: bin/
    filter:
      - "ggml-base.en.bin"
      - "whisper-cli-*"
      - "*.dll"
      - "!ggml-large-v3-turbo.bin"
  - from: build/icon.ico
    to: build/icon.ico

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch: [arm64]
    - target: zip
      arch: [arm64]

win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: StJohn Author Studio Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico

# Auto-update via GitHub Releases. electron-updater inside the running
# app reads `latest.yml` (Windows) / `latest-mac.yml` (Mac) attached to
# the latest non-draft release at this repo to decide whether a newer
# version exists. When `electron-builder` runs locally it generates
# those metadata files alongside the artifacts; the release-publish
# step uploads them all together.
publish:
  provider: github
  owner: stjohnbuilds
  repo: stjohn-author-studio-4.0
