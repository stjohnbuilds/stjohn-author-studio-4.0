name: Keep Supabase awake

# Supabase's free plan pauses the database after ~7 days with no activity.
# This job runs a tiny read query twice a week so it always looks active.
on:
  schedule:
    - cron: "23 9 * * 1,4" # every Monday + Thursday, 09:23 UTC
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/script_sync_projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -o /dev/null -w "Supabase answered with HTTP %{http_code}\n"

      # GitHub switches off schedules in repos with no pushes for 60 days.
      # Re-enabling ourselves on every run resets that timer.
      - name: Keep this schedule switched on
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
